name: Meflix

on:
  push:
    branches: [main, "claude/gradle-debug-build-QxixK"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/android-34/android.jar" && echo "android-34 OK" || echo "android-34 MISSING"
          ls "$ANDROID_HOME/build-tools/34.0.0/aapt" && echo "build-tools OK" || echo "build-tools MISSING"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          exit $BUILD_STATUS

      - name: Show build errors
        if: failure()
        run: |
          echo "=== Kotlin compiler errors ==="
          grep -E "^e: |^w: " /tmp/gradle-build.log | head -50 || true
          echo "=== Gradle failure details ==="
          grep -A 20 "FAILURE: Build failed" /tmp/gradle-build.log | head -40 || true
          echo "=== Failed tasks ==="
          grep " FAILED" /tmp/gradle-build.log | head -10 || true
          echo "=== Last 80 lines ==="
          tail -80 /tmp/gradle-build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meflix-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
