navigationCompose = "2.7.7"
lifecycleViewmodelCompose = "2.7.0"
media3 = "1.3.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
coil = "2.6.0"
datastore = "1.1.1"
accompanist = "0.34.0"
